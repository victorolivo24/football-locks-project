# Nightly encrypted database backup, kept for 30 days.
#
# The repo is public, and artifacts on a public repo can be downloaded by any
# signed-in GitHub user. The dump holds password hashes and push subscription
# keys, so it is encrypted before upload. Without BACKUP_PASSPHRASE the
# artifacts are useless — keep a copy of it somewhere other than this repo.
#
# Restore:
#   gpg --decrypt backup.sql.gz.gpg | gunzip | psql "$DATABASE_URL"
name: Backup database

on:
  schedule:
    - cron: '0 9 * * *'   # 5am ET, after the nightly results sweep
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install pg_dump 17
        # Must match the server's major version; the runner ships 16, which
        # refuses to dump a Postgres 17 database.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump, compress and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "DATABASE_URL and BACKUP_PASSPHRASE secrets are required."
            exit 1
          fi
          /usr/lib/postgresql/17/bin/pg_dump --no-owner --no-privileges "$DATABASE_URL" \
            | gzip \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o backup.sql.gz.gpg
          ls -lh backup.sql.gz.gpg

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.sql.gz.gpg
          retention-days: 30
