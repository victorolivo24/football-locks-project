# Keeps results and alerts moving when nobody has the app open.
#
# The cadence comes from a loop inside the job, NOT from the cron schedule.
# GitHub drops scheduled runs under load, hourly ones included: on 2026-09-27
# nothing fired between 09:42 and 17:00 UTC, so the 1pm slate kicked off with
# no job running and alerts only went out when someone opened the site.
#
# So each run covers the whole slate rather than its own hour: it polls every
# 60 seconds for five hours, and any one trigger firing is enough. A later
# trigger simply restarts the window.
#
# Times are UTC. Eastern is UTC-4 in season (UTC-5 after early November), so
# each window is deliberately wide enough to cover both.
name: Refresh results

on:
  schedule:
    - cron: '0 0-5 * * 5'    # Thursday night football, into Friday UTC
    - cron: '0 12-23 * * 0'  # Sunday, from the London kickoffs on
    - cron: '0 0-5 * * 1'    # Sunday night football, into Monday UTC
    - cron: '0 0-5 * * 2'    # Monday night football, into Tuesday UTC
    - cron: '0 16-23 * * 6'  # Saturday games, late season
    - cron: '0 0-5 * * 0'    # Saturday night, into Sunday UTC
  workflow_dispatch:
    inputs:
      minutes:
        description: How long to keep polling
        default: '300'

concurrency:
  # A later run supersedes one still looping, rather than doubling the polling.
  group: refresh-results
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Generous ceiling; the loop exits on its own well before this.
    # GitHub's own hard limit for a job is six hours.
    timeout-minutes: 330
    steps:
      - name: Poll for results and send any alerts
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://football-locks-project.vercel.app' }}
          MINUTES: ${{ github.event.inputs.minutes || '300' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set on this repository."
            exit 1
          fi

          deadline=$(( $(date +%s) + MINUTES * 60 ))
          attempts=0
          failures=0

          while [ "$(date +%s)" -lt "$deadline" ]; do
            status=$(curl -s -o /tmp/body.txt -w '%{http_code}' --max-time 45 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/cron/resolve-results" || echo 000)

            attempts=$((attempts + 1))

            if [ "$status" = "200" ]; then
              echo "$(date -u +%H:%M:%S) ok  $(cat /tmp/body.txt)"
            else
              failures=$((failures + 1))
              echo "$(date -u +%H:%M:%S) HTTP $status $(cat /tmp/body.txt)"
            fi

            sleep 60
          done

          echo "polled $attempts times, $failures failed"

          # A bad secret or a broken deploy should fail loudly rather than
          # leaving a job that quietly does nothing every week.
          if [ "$attempts" -gt 0 ] && [ "$failures" -eq "$attempts" ]; then
            echo "every request failed"
            exit 1
          fi
