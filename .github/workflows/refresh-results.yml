# Keeps results and alerts moving when nobody has the app open.
#
# Vercel's Hobby plan allows one cron run per day, and the in-app polling only
# runs while someone has a page loaded — so a Thursday game finishing at 11pm
# sat unresolved until the 4am sweep. GitHub Actions is free and unlimited on
# public repos, so it fills the gap during the hours games actually end.
#
# Times are UTC. Eastern is UTC-4 in season (UTC-5 after early November), so
# each window is deliberately wide enough to cover both.
name: Refresh results

on:
  schedule:
    - cron: '*/5 0-5 * * 5'    # Thursday night football, into Friday UTC
    - cron: '*/5 16-23 * * 0'  # Sunday early and afternoon slates
    - cron: '*/5 0-5 * * 1'    # Sunday night football, into Monday UTC
    - cron: '*/5 0-5 * * 2'    # Monday night football, into Tuesday UTC
    - cron: '*/5 16-23 * * 6'  # Saturday games, late season
  workflow_dispatch:            # and on demand, from the Actions tab

concurrency:
  group: refresh-results
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Pull results and send any alerts
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://football-locks-project.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set on this repository."
            exit 1
          fi

          status=$(curl -s -o /tmp/body.txt -w '%{http_code}' --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/resolve-results")

          echo "HTTP $status"
          cat /tmp/body.txt

          # A bad secret or a broken deploy should fail loudly rather than
          # leaving a job that silently does nothing every five minutes.
          if [ "$status" != "200" ]; then
            exit 1
          fi
